<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pencil Time Manifold</title>
<style>
:root{--paper:#fbf6e8;--ink:#17202a;--muted:#687076;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#efe5cf;color:var(--ink);font:14px/1.4 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px 10px calc(76px + var(--safe));background:linear-gradient(130deg,#eadfc5,#fbf6e8 55%,#e5d7bc)}.wrap{max-width:520px;margin:0 auto}.panel{background:rgba(251,246,232,.9);border:1px solid rgba(23,32,42,.16);border-radius:18px;box-shadow:0 12px 35px rgba(50,38,20,.18);padding:12px}.title{margin:0 0 3px;letter-spacing:.08em;text-transform:uppercase;font-size:14px}.sub{margin:0 0 10px;color:var(--muted);font-size:12px}.stage{margin:10px auto;background:#fff9ea;border:1px solid rgba(23,32,42,.16);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),0 8px 28px rgba(50,38,20,.16);overflow:hidden;width:min(100%,420px);aspect-ratio:1/1}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.row label{font-size:12px}.row output{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#7a4a20;min-width:58px;text-align:right}select,button{min-height:42px;border:1px solid rgba(23,32,42,.2);border-radius:12px;background:rgba(255,252,242,.9);color:var(--ink);font:inherit;padding:9px 10px}input[type=range]{grid-column:1/-1;width:100%;accent-color:#17202a}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.buttons button{padding:8px 4px}.quick{position:fixed;left:50%;bottom:calc(10px + var(--safe));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(251,246,232,.82);backdrop-filter:blur(10px);border:1px solid rgba(23,32,42,.16)}.quick button{width:44px;height:44px;border-radius:999px;padding:0;font-weight:700}.status{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#5c4b35;margin:8px 2px 0}.hint{font-size:11px;color:var(--muted);margin:8px 2px 0}@media(max-width:390px){body{padding-left:8px;padding-right:8px}.buttons{grid-template-columns:repeat(2,1fr)}.stage{width:min(100%,350px)}}
</style>
</head>
<body>
<main class="wrap">
<section class="panel">
<h1 class="title">Pencil Time Manifold</h1>
<p class="sub">Contained phone draughting: quick, bounded, pencil-like constructions.</p>
<div class="stage"><canvas id="paper" width="420" height="420"></canvas></div>
<div class="controls">
<div class="row"><label for="toy">Pencil toy</label><select id="toy"><option value="mini">Mini manifold</option><option value="medians">Median insert</option><option value="g12">G12 flower</option><option value="pocket">Pocket dots</option><option value="erase">Draw then erase</option></select></div>
<div class="row"><label for="lines">Extent</label><output id="linesOut">13</output><input id="lines" type="range" min="5" max="21" step="2" value="13"></div>
<div class="row"><label for="speed">Speed</label><output id="speedOut">4.0x</output><input id="speed" type="range" min="1" max="10" step="0.5" value="4"></div>
<div class="row"><label for="wobble">Wobble</label><output id="wobbleOut">0.35</output><input id="wobble" type="range" min="0" max="1" step="0.01" value="0.35"></div>
<div class="buttons"><button id="play">Pause</button><button id="restart">Restart</button><button id="finish">Finish</button><button id="png">PNG</button></div>
</div>
<p class="status" id="status">ready</p>
<p class="hint">Default timings are intentionally compressed for phone use. The drawing stays inside the square paper stage.</p>
</section>
</main>
<nav class="quick"><button id="back">↩</button></nav>
<script>
(function(){
const c=document.getElementById('paper'),x=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,SQRT3=Math.sqrt(3);let W=420,H=420,CX=210,CY=210,S=138,t=0,last=performance.now(),paused=false,done=false,plan=[];const toy=$('toy'),lines=$('lines'),speed=$('speed'),wobble=$('wobble'),status=$('status');
function sync(){linesOut.value=lines.value;speedOut.value=(+speed.value).toFixed(1)+'x';wobbleOut.value=(+wobble.value).toFixed(2)}
function clear(){x.fillStyle='#fff9ea';x.fillRect(0,0,W,H);x.strokeStyle='rgba(40,30,20,.09)';for(let i=0;i<50;i++){let y=(i*37)%H;x.beginPath();x.moveTo(0,y);x.lineTo(W,y+Math.sin(i)*3);x.stroke()}}
function xy(m,n,sc=S){return{x:CX+(m+.5*n)*sc,y:CY+(SQRT3/2*n)*sc}}function item(type,a,b,dt=.18){return{type,a,b,dt}}
function build(){plan=[];const N=+lines.value,half=(N-1)/2,sp=.22;function fam(theta,kind){for(let k=-half;k<=half;k++)plan.push(item('line',{theta,d:k*sp,kind},null,.11))}if(toy.value==='mini'||toy.value==='erase'){fam(0,'p');fam(Math.PI/3,'p');fam(-Math.PI/3,'p')}if(toy.value==='medians'){fam(0,'p');fam(Math.PI/3,'p');fam(-Math.PI/3,'p');fam(Math.PI/6,'d');fam(Math.PI/2,'d');fam(5*Math.PI/6,'d')}if(toy.value==='g12'){for(let r=0;r<13;r++)plan.push(item('circle',r,null,.16));for(let k=0;k<12;k++)plan.push(item('ray',k,null,.08))}if(toy.value==='pocket'){for(let r=0;r<11;r++){let len=r%2?7:8;for(let q=0;q<len;q++)plan.push(item('dot',{r,q,len},null,.035))}}let acc=0;for(const p of plan){p.start=acc;acc+=p.dt}plan.total=acc;t=0;done=false;clear();draw(0)}
function rough(x1,y1,x2,y2,a,col){const w=+wobble.value*2.2;x.strokeStyle=col;x.globalAlpha=a;x.lineWidth=1.1;x.beginPath();for(let i=0;i<=12;i++){let u=i/12,xx=x1+(x2-x1)*u+Math.sin(i*9.3+t*2)*w,yy=y1+(y2-y1)*u+Math.cos(i*7.1+t)*w;if(i)x.lineTo(xx,yy);else x.moveTo(xx,yy)}x.stroke();x.globalAlpha=1}
function drawLine(o,p){const th=o.theta,d=o.d,vx=Math.cos(th),vy=Math.sin(th),nx=-Math.sin(th),ny=Math.cos(th),L=S*1.72*p,px=nx*d*S,py=ny*d*S,col=o.kind==='d'?'rgba(45,80,150,.55)':'rgba(25,32,42,.66)';rough(CX+px-vx*L,CY+py-vy*L,CX+px+vx*L,CY+py+vy*L,.9,col)}
function drawCircle(i,p){const R=S*.18,cent=[{x:0,y:0}];for(let k=0;k<6;k++)cent.push({x:2*R*Math.cos(k*TAU/6),y:2*R*Math.sin(k*TAU/6)});for(let k=0;k<6;k++)cent.push({x:3.45*R*Math.cos(k*TAU/6),y:3.45*R*Math.sin(k*TAU/6)});let q=cent[i%cent.length];x.strokeStyle='rgba(145,55,45,.55)';x.lineWidth=1.2;x.beginPath();x.arc(CX+q.x,CY+q.y,R,0,TAU*p);x.stroke()}
function drawRay(k,p){let a=k*TAU/12;x.strokeStyle='rgba(45,80,150,.45)';x.beginPath();x.moveTo(CX,CY);x.lineTo(CX+Math.cos(a)*S*1.15*p,CY+Math.sin(a)*S*1.15*p);x.stroke()}
function drawDot(o,p){let pt=xy((o.q+(o.len===7?.5:0)-3.5)/3.8,(o.r-5)/3.8);x.fillStyle=o.r===0||o.r===10||o.q===0||o.q===o.len-1?'rgba(145,80,30,.8)':'rgba(25,32,42,.75)';x.beginPath();x.arc(pt.x,pt.y,3.6*p,0,TAU);x.fill()}
function draw(now){clear();let tt=done?plan.total:now;if(toy.value==='erase')tt=plan.total*Math.min(1,tt/plan.total);for(const it of plan){if(tt<it.start)continue;let p=Math.max(0,Math.min(1,(tt-it.start)/it.dt));if(it.type==='line')drawLine(it.a,p);if(it.type==='circle')drawCircle(it.a,p);if(it.type==='ray')drawRay(it.a,p);if(it.type==='dot')drawDot(it.a,p)}if(toy.value==='erase'&&now>plan.total*.6&&!done){x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.08)';x.beginPath();x.arc(CX,CY,S*1.4*((now/plan.total)-.6)/.4,0,TAU);x.fill();x.globalCompositeOperation='source-over'}let pct=Math.min(100,100*now/plan.total).toFixed(0);status.textContent=(done?'finished':'drawn '+pct+'%')+' · approx '+(plan.total*12).toFixed(0)+' sec human-scale · '+plan.length+' marks'}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused&&!done){t+=dt*(+speed.value);draw(t);if(t>=plan.total){done=true;draw(plan.total)}}requestAnimationFrame(loop)}
toy.onchange=build;[lines,speed,wobble].forEach(e=>e.oninput=sync);lines.onchange=build;$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Resume':'Pause'};$('restart').onclick=build;$('finish').onclick=()=>{done=true;draw(plan.total)};$('png').onclick=()=>{let a=document.createElement('a');a.download='pencil-contained.png';a.href=c.toDataURL('image/png');a.click()};$('back').onclick=()=>location.href='index.html';sync();build();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
