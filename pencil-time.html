<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Pencil Time Manifold</title>
<style>
:root{--bg:#f3efe5;--paper:#fbf6e8;--ink:#17202a;--soft:#5f6b72;--line:rgba(25,32,42,.62);--blue:rgba(52,86,145,.62);--red:rgba(160,66,66,.62);--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}body{background:radial-gradient(circle at 20% 10%,rgba(255,255,255,.45),transparent 26%),linear-gradient(110deg,#efe6d0,#fbf6e8 52%,#eadfc5)}canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block}.hud{position:fixed;left:12px;top:12px;width:min(410px,calc(100vw - 24px));max-height:calc(100dvh - 88px);overflow:auto;background:rgba(251,246,232,.86);border:1px solid rgba(23,32,42,.15);border-radius:16px;box-shadow:0 18px 60px rgba(50,38,20,.22);backdrop-filter:blur(12px);padding:14px;z-index:5}.title{margin:0 0 4px;letter-spacing:.08em;text-transform:uppercase;font-size:15px}.subtitle{margin:0 0 12px;color:var(--soft);font-size:12px}.controls{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.row label{font-size:12px}.row output{min-width:72px;text-align:right;color:#7a4a20;font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}input[type=range]{grid-column:1/-1;width:100%;height:28px;accent-color:#17202a}select,button{border:1px solid rgba(23,32,42,.2);border-radius:11px;background:rgba(255,252,242,.84);color:var(--ink);padding:9px 10px;font:inherit;min-height:40px}button{cursor:pointer}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1 1 88px}.note{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(23,32,42,.22);color:var(--soft);font-size:11px}.pill{display:inline-block;margin-right:5px;margin-bottom:5px;padding:2px 7px;border-radius:999px;border:1px solid rgba(23,32,42,.18);background:rgba(255,255,255,.4);letter-spacing:.04em}.quick{position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(23,32,42,.15);border-radius:999px;background:rgba(251,246,232,.72);backdrop-filter:blur(10px);z-index:6}.quick button{width:44px;height:44px;border-radius:999px;padding:0;font-weight:700}.hidden{display:none!important}@media(max-width:760px){.hud{left:8px;right:8px;top:8px;width:auto;max-height:min(56dvh,420px);padding:12px}.note{display:none}select,button{min-height:44px}.hud.compact{display:none}.quick button{width:40px;height:40px}}
</style>
</head>
<body>
<canvas id="paper"></canvas>
<section class="hud" id="hud">
<h1 class="title">Pencil Time Manifold</h1>
<p class="subtitle">A hex manifold drawn line-by-line in approximate human time.</p>
<div class="controls">
<div class="row"><label for="pace">Human pace</label><select id="pace"><option value="quick">Quick sketch</option><option value="careful" selected>Careful ruler</option><option value="formal">Formal construction</option><option value="meditative">Meditative draught</option></select></div>
<div class="row"><label for="layer">Layer</label><select id="layer"><option value="primal">Primal only</option><option value="dual">Primal + dual medians</option><option value="g12">Primal + G12 + circles</option></select></div>
<div class="row"><label for="lines">Lines per family</label><output id="linesOut">17</output><input id="lines" type="range" min="7" max="41" step="2" value="17"></div>
<div class="row"><label for="speed">Time scale</label><output id="speedOut">12x</output><input id="speed" type="range" min="1" max="60" step="1" value="12"></div>
<div class="row"><label for="wobble">Hand wobble</label><output id="wobbleOut">0.35</output><input id="wobble" type="range" min="0" max="1" step="0.01" value="0.35"></div>
<div class="row"><label for="ghost">Eraser / ghost</label><output id="ghostOut">0.08</output><input id="ghost" type="range" min="0.02" max="0.18" step="0.01" value="0.08"></div>
<div class="buttons"><button id="play">Pause</button><button id="restart">Restart</button><button id="finish">Finish</button><button id="png">Save PNG</button></div>
</div>
<div class="note"><span class="pill">0°</span><span class="pill">+60°</span><span class="pill">-60°</span><span class="pill">human time</span><br>The clock estimates how long a pencil/ruler construction might take. Animation is accelerated by the time-scale slider.</div>
</section>
<nav class="quick"><button id="menu">☰</button><button id="back">↩</button></nav>
<script>
(function(){
const canvas=document.getElementById('paper'),ctx=canvas.getContext('2d',{alpha:false});const $=id=>document.getElementById(id);const TAU=Math.PI*2,SQRT3=Math.sqrt(3);let W=0,H=0,CX=0,CY=0,S=1,DPR=1,isMobile=false,paused=false,start=performance.now(),elapsed=0,last=performance.now(),plan=[],done=false;
const pace=$('pace'),layer=$('layer'),lines=$('lines'),speed=$('speed'),wobble=$('wobble'),ghost=$('ghost'),hud=$('hud');const out={lines:$('linesOut'),speed:$('speedOut'),wobble:$('wobbleOut'),ghost:$('ghostOut')};
function mobile(){return matchMedia('(pointer:coarse)').matches||innerWidth<760}function resize(){isMobile=mobile();DPR=Math.min(isMobile?1.35:2,Math.max(1,devicePixelRatio||1));W=innerWidth;H=innerHeight;CX=W/2;CY=H/2;S=Math.min(W,H)*(isMobile?.42:.39);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);rebuild(false)}
function paceSeconds(){return {quick:18,careful:45,formal:90,meditative:150}[pace.value]||45}function sync(){out.lines.value=lines.value;out.speed.value=speed.value+'x';out.wobble.value=(+wobble.value).toFixed(2);out.ghost.value=(+ghost.value).toFixed(2);$('finish').textContent=done?'Reset finish':'Finish'}
function clear(){ctx.fillStyle='#fbf6e8';ctx.fillRect(0,0,W,H);paperTexture()}
function paperTexture(){ctx.save();ctx.globalAlpha=.12;for(let i=0;i<180;i++){const x=(i*97)%W,y=(i*53)%H;ctx.fillStyle=i%2?'#decfac':'#ffffff';ctx.fillRect(x,y,1,1)}ctx.restore()}
function lineItem(theta,d,type,index,total){return{theta,d,type,index,total,seconds:paceSeconds()*(type==='circle'?1.4:type==='dual'?.75:1)}}
function buildPlan(){const N=+lines.value,half=(N-1)/2,sp=S/half*.68,items=[];[0,Math.PI/3,-Math.PI/3].forEach((theta,f)=>{for(let k=-half;k<=half;k++)items.push(lineItem(theta,k*sp,'primal',items.length,N*3))});if(layer.value!=='primal'){[Math.PI/6,Math.PI/2,5*Math.PI/6].forEach(theta=>{for(let k=-half;k<=half;k++)items.push(lineItem(theta,k*sp/SQRT3,'dual',items.length,N*3))})}if(layer.value==='g12'){for(let r=0;r<13;r++)items.push({type:'circle',index:items.length,seconds:paceSeconds()*1.4,ring:r})}let acc=0;for(const it of items){it.start=acc;acc+=it.seconds}items.total=acc;return items}
function rebuild(reset=true){sync();plan=buildPlan();if(reset){elapsed=0;start=performance.now();done=false}clear();draw(0)}
function roughLine(x1,y1,x2,y2,alpha,color){const w=+wobble.value*2.8;ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.lineWidth=1.05;ctx.beginPath();const seg=18;for(let i=0;i<=seg;i++){const u=i/seg,x=x1+(x2-x1)*u+(Math.sin(i*12.989+elapsed*.001)*.5)*w,y=y1+(y2-y1)*u+(Math.cos(i*9.17+elapsed*.001)*.5)*w;if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y)}ctx.stroke();ctx.globalAlpha=1}
function drawLine(theta,d,progress,type){const vx=Math.cos(theta),vy=Math.sin(theta),nx=-Math.sin(theta),ny=Math.cos(theta),L=Math.hypot(W,H)*.62,px=nx*d,py=ny*d,len=L*progress,x1=CX+px-vx*len,y1=CY+py-vy*len,x2=CX+px+vx*len,y2=CY+py+vy*len;const color=type==='dual'?'rgba(52,86,145,.58)':'rgba(23,32,42,.62)';roughLine(x1,y1,x2,y2,.9,color)}
function drawCircleItem(ring,progress){const R=S*.13,centers=[{x:0,y:0}];for(let k=0;k<6;k++)centers.push({x:2*R*Math.cos(k*TAU/6),y:2*R*Math.sin(k*TAU/6)});for(let k=0;k<6;k++)centers.push({x:4*R*Math.cos(k*TAU/6),y:4*R*Math.sin(k*TAU/6)});const c=centers[ring%centers.length];ctx.strokeStyle='rgba(160,66,66,.52)';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(CX+c.x,CY+c.y,R,0,TAU*progress);ctx.stroke()}
function estimate(){const mins=plan.total/60;return mins<60?mins.toFixed(1)+' min':(mins/60).toFixed(1)+' hr'}
function draw(nowSec){clear();const t=done?plan.total:nowSec;for(const it of plan){if(t<it.start)continue;const p=Math.max(0,Math.min(1,(t-it.start)/it.seconds));if(it.type==='circle')drawCircleItem(it.ring,p);else drawLine(it.theta,it.d,p,it.type)}drawStatus(t)}
function drawStatus(t){ctx.save();ctx.fillStyle='rgba(251,246,232,.76)';ctx.strokeStyle='rgba(23,32,42,.16)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(12,H-86,Math.min(430,W-24),62,12);ctx.fill();ctx.stroke();ctx.fillStyle='#17202a';ctx.font='12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';const constructed=Math.min(100,100*t/plan.total).toFixed(1);ctx.fillText('drawn: '+constructed+'%   human estimate: '+estimate(),26,H-55);ctx.fillText('animation: '+speed.value+'x   lines: '+plan.filter(x=>x.type!=='circle').length+'   units: pencil/ruler',26,H-34);ctx.restore()}
function loop(now){const dt=(now-last)/1000;last=now;if(!paused&&!done){elapsed+=dt*+speed.value;ctx.save();ctx.globalAlpha=+ghost.value;ctx.fillStyle='#fbf6e8';ctx.fillRect(0,0,W,H);ctx.restore();draw(elapsed)}requestAnimationFrame(loop)}
$('play').onclick=()=>{paused=!paused;$('play').textContent=paused?'Resume':'Pause'};$('restart').onclick=()=>rebuild(true);$('finish').onclick=()=>{done=!done;draw(done?plan.total:elapsed);sync()};$('png').onclick=()=>{const a=document.createElement('a');a.download='pencil-time-manifold.png';a.href=canvas.toDataURL('image/png');a.click()};$('menu').onclick=()=>hud.classList.toggle('compact');$('back').onclick=()=>location.href='index.html';canvas.addEventListener('pointerdown',()=>{if(isMobile)hud.classList.add('compact')},{passive:true});[pace,layer,lines,speed,wobble,ghost].forEach(e=>{e.oninput=sync;e.onchange=()=>rebuild(true)});addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;$('play').textContent=paused?'Resume':'Pause'}if(e.key==='h'||e.key==='H')hud.classList.toggle('compact')});addEventListener('resize',resize,{passive:true});resize();sync();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
