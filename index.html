<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Lawful Kaleidoscope Toy Cabinet</title>
<meta name="description" content="A mobile-friendly cabinet of lawful 60 degree geometry toys.">
<style>
:root{--bg:#050809;--panel:rgba(7,14,16,.88);--text:#eafff8;--muted:#9bcac0;--mint:#6fffd2;--blue:#7aa2ff;--gold:#ffcc66;--rose:#ff6b8a;--green:#39ff14;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}body{background:radial-gradient(circle at 18% 8%,rgba(111,255,210,.14),transparent 28%),radial-gradient(circle at 82% 92%,rgba(122,162,255,.12),transparent 32%),#050809}canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block;touch-action:none}.hud{position:fixed;left:14px;top:14px;width:min(390px,calc(100vw - 28px));max-height:calc(100dvh - 92px);overflow:auto;background:var(--panel);border:1px solid rgba(111,255,210,.18);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.55);backdrop-filter:blur(16px);padding:14px;z-index:5}.title{margin:0 0 4px;color:var(--mint);letter-spacing:.12em;text-transform:uppercase;font-size:15px}.subtitle{margin:0 0 12px;color:var(--muted);font-size:12px}.controls{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.row label{font-size:12px}.row output{min-width:48px;text-align:right;color:var(--gold);font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}input[type=range]{grid-column:1/-1;width:100%;height:28px;accent-color:var(--mint)}select,button{border:1px solid rgba(111,255,210,.24);border-radius:11px;background:rgba(4,10,11,.86);color:var(--text);padding:9px 10px;font:inherit;min-height:40px}button{cursor:pointer}button:active{transform:translateY(1px)}.button-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}.button-row button{flex:1 1 94px}.law{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(111,255,210,.22);color:var(--muted);font-size:11px}.pill{display:inline-block;margin-right:5px;margin-bottom:5px;padding:2px 7px;border-radius:999px;border:1px solid rgba(111,255,210,.26);color:var(--mint);background:rgba(111,255,210,.06);letter-spacing:.04em}.quickbar{position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(111,255,210,.16);border-radius:999px;background:rgba(0,0,0,.32);backdrop-filter:blur(12px);z-index:6}.quickbar button{width:42px;height:42px;min-height:42px;border-radius:999px;padding:0;font-weight:700}.quickbar button.active{background:rgba(111,255,210,.18);border-color:rgba(111,255,210,.72);color:var(--mint)}.footer-note{position:fixed;right:14px;bottom:14px;max-width:min(560px,calc(100vw - 28px));color:rgba(234,255,248,.72);font-size:12px;background:rgba(0,0,0,.28);padding:8px 10px;border:1px solid rgba(255,255,255,.08);border-radius:10px;backdrop-filter:blur(10px)}.hidden{display:none!important}
@media(max-width:760px){.hud{left:8px;right:8px;top:8px;width:auto;max-height:min(58dvh,430px);padding:12px;border-radius:14px}.title{font-size:13px}.subtitle{font-size:11px;margin-bottom:9px}.controls{gap:8px}.row{gap:8px}.row label{font-size:11px}select,button{min-height:44px;padding:10px}.law{display:none}.footer-note{display:none}.button-row button{flex:1 1 42%}}@media(max-width:420px){.hud.compact{display:none}.hud{max-height:52dvh}.row{grid-template-columns:1fr 44px}.button-row button{font-size:12px}.quickbar{gap:6px;padding:7px}.quickbar button{width:40px;height:40px;min-height:40px}}
</style>
</head>
<body>
<canvas id="field" aria-label="Lawful geometry toy cabinet"></canvas>
<section class="hud" id="hud">
<h1 class="title">Lawful Toy Cabinet</h1><p class="subtitle">Mobile-friendly 60° MN-field geometry toys.</p>
<div class="controls">
<div class="row"><label for="toy">Toy</label><select id="toy"><option value="kaleido">01 · Endless Kaleidoscope</option><option value="trihex">02 · Tri-Hex Field</option><option value="pocket">03 · Pocket Manifold</option><option value="orbits">04 · Harmonic Orbits</option></select></div>
<div class="row"><label for="mode">Mode</label><select id="mode"><option value="bloom">Bloom</option><option value="weave">Weave</option><option value="cellular">Cellular</option></select></div>
<div class="row"><label for="symmetry">Symmetry</label><output id="symmetryOut">12</output><input id="symmetry" type="range" min="6" max="12" step="6" value="12"></div>
<div class="row"><label for="density">Density / extent</label><output id="densityOut">96</output><input id="density" type="range" min="24" max="180" step="1" value="96"></div>
<div class="row"><label for="speed">Speed</label><output id="speedOut">0.65</output><input id="speed" type="range" min="0.05" max="2.00" step="0.01" value="0.65"></div>
<div class="row"><label for="pulse">Pulse</label><output id="pulseOut">0.72</output><input id="pulse" type="range" min="0" max="1.5" step="0.01" value="0.72"></div>
<div class="row"><label for="correction">Correction</label><output id="correctionOut">0.55</output><input id="correction" type="range" min="0" max="1" step="0.01" value="0.55"></div>
<div class="row"><label for="trails">Trails / fade</label><output id="trailsOut">0.10</output><input id="trails" type="range" min="0.03" max="0.35" step="0.01" value="0.10"></div>
<div class="button-row"><button id="pauseBtn">Pause</button><button id="seedBtn">New seed</button><button id="pngBtn">Save PNG</button><button id="hideBtn">Hide</button></div>
</div>
<div class="law" id="caption"><span class="pill">MN basis</span><span class="pill">60° field</span><span class="pill">mobile</span><br>Choose a toy. Each obeys m=(1,0), n=(1/2,√3/2).</div>
</section>
<nav class="quickbar" aria-label="Toy shortcuts"><button data-toy="0" class="active">1</button><button data-toy="1">2</button><button data-toy="2">3</button><button data-toy="3">4</button><button id="panelBtn">☰</button></nav>
<div class="footer-note">H show/hide · Space pause · R new seed · 1/2/3/4 switch toys · S save PNG</div>
<script>
(function(){
const canvas=document.getElementById('field'),ctx=canvas.getContext('2d',{alpha:false});
const $=id=>document.getElementById(id),TAU=Math.PI*2,SQRT3=Math.sqrt(3);let W=0,H=0,CX=0,CY=0,SCALE=1,DPR=1,time=0,last=performance.now(),paused=false,seed=1,quality=1,isMobile=false,frameSkip=0;
const controls={toy:$('toy'),mode:$('mode'),symmetry:$('symmetry'),density:$('density'),speed:$('speed'),pulse:$('pulse'),correction:$('correction'),trails:$('trails')};
const outputs={symmetry:$('symmetryOut'),density:$('densityOut'),speed:$('speedOut'),pulse:$('pulseOut'),correction:$('correctionOut'),trails:$('trailsOut')};
const pauseBtn=$('pauseBtn'),seedBtn=$('seedBtn'),pngBtn=$('pngBtn'),hideBtn=$('hideBtn'),hud=$('hud'),caption=$('caption'),panelBtn=$('panelBtn');
const quick=[...document.querySelectorAll('.quickbar button[data-toy]')];const palette=[[111,255,210],[122,162,255],[255,204,102],[255,107,138],[57,255,20]];
function mobile(){return matchMedia('(pointer:coarse)').matches||innerWidth<760}
function mobileDensity(v){return isMobile?Math.min(v,92):v}
function resize(){isMobile=mobile();quality=isMobile?.72:1;DPR=Math.min(isMobile?1.35:2,Math.max(1,devicePixelRatio||1));W=innerWidth;H=innerHeight;CX=W/2;CY=H/2;SCALE=Math.min(W,H)*(isMobile?.48:.43);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);clearHard();sync()}
function clearHard(){ctx.save();ctx.setTransform(DPR,0,0,DPR,0,0);ctx.fillStyle='#050809';ctx.fillRect(0,0,W,H);ctx.restore()}
function sync(){outputs.symmetry.value=controls.symmetry.value;outputs.density.value=isMobile?mobileDensity(+controls.density.value)+' cap':controls.density.value;outputs.speed.value=(+controls.speed.value).toFixed(2);outputs.pulse.value=(+controls.pulse.value).toFixed(2);outputs.correction.value=(+controls.correction.value).toFixed(2);outputs.trails.value=(+controls.trails.value).toFixed(2);updateCaption();quick.forEach((b,i)=>b.classList.toggle('active',i===controls.toy.selectedIndex))}
Object.values(controls).forEach(el=>{el.addEventListener('input',sync);el.addEventListener('change',()=>{sync();clearHard()})});
function updateCaption(){const toy=controls.toy.value;const text={kaleido:'Endless Kaleidoscope: rotated, mirrored, pulsed, and corrected motion.',trihex:'Tri-Hex Field: 0°, +60°, -60° families breathe across the screen.',pocket:'Pocket Manifold: an 83-point bounded lattice with boundary behavior.',orbits:'Harmonic Orbits: hex-constrained orbital waves with coherent trails.'}[toy];caption.innerHTML='<span class="pill">MN basis</span><span class="pill">60° field</span><span class="pill">'+toy+'</span><br>'+text}
function reseed(){seed=(Date.now()^Math.floor(Math.random()*0xffffffff))>>>0;time=0;clearHard()}function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}
function mnToXY(m,n,scale=SCALE){return{x:(m+.5*n)*scale,y:(SQRT3/2*n)*scale}}function rot(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c}}function col(i,a){const c=palette[i%palette.length];return`rgba(${c[0]},${c[1]},${c[2]},${a})`}function fade(a){ctx.save();ctx.globalCompositeOperation='source-over';ctx.fillStyle=`rgba(5,8,9,${Math.min(.45,a+(isMobile?.02:0))})`;ctx.fillRect(0,0,W,H);ctx.restore()}
function drawLineFamily(theta,spacing,color,alpha,phase=0){const vx=Math.cos(theta),vy=Math.sin(theta),nx=-Math.sin(theta),ny=Math.cos(theta),L=Math.hypot(W,H),limit=Math.ceil(L/spacing),step=isMobile?2:1;ctx.strokeStyle=color.replace('ALPHA',alpha);ctx.lineWidth=isMobile?.75:1;for(let k=-limit;k<=limit;k+=step){const d=(k+phase)*spacing,px=nx*d,py=ny*d;ctx.beginPath();ctx.moveTo(px-vx*L,py-vy*L);ctx.lineTo(px+vx*L,py+vy*L);ctx.stroke()}}
function hexField(alpha=.018,phase=0,dual=false){ctx.save();ctx.translate(CX,CY);const spacing=SCALE/(isMobile?7.5:9);[0,Math.PI/3,-Math.PI/3].forEach(a=>drawLineFamily(a,spacing,'rgba(111,255,210,ALPHA)',alpha,phase));if(dual)[Math.PI/6,Math.PI/2,5*Math.PI/6].forEach(a=>drawLineFamily(a,spacing/SQRT3,'rgba(122,162,255,ALPHA)',alpha*.9,-phase*.7));ctx.restore()}
function bloomPoint(t,i,d,cor,pulse){const u=i/d,law=Math.sin(TAU*(u*3+t*.071))+Math.cos(TAU*(u*5-t*.037)),r=.10+.82*Math.pow(u,.72)+(.055*(1-cor))*law,a=TAU*(u*2+.05*Math.sin(t*.13))+t*.19;return mnToXY(r*Math.cos(a)+.12*Math.sin(t*.2+i*.3)*pulse,r*Math.sin(a)+.12*Math.cos(t*.17-i*.23)*pulse)}
function weavePoint(t,i,d,cor,pulse){const u=i/d,lane=(i%6)/6,phase=TAU*lane,w=Math.sin(TAU*(u*4+t*.055+lane)),x=Math.cos(TAU*(u*7-t*.034));return mnToXY((u*1.85-.92)+.18*w*pulse,.32*Math.sin(TAU*u+phase+t*.25)+.16*x*(1-cor*.5))}
function cellularPoint(t,i,d,cor,pulse){const rowLengths=[8,7,8,7,8,7,8,7,8,7,8],id=i%83;let row=0,col=id;for(let r=0;r<rowLengths.length;r++){if(col<rowLengths[r]){row=r;break}col-=rowLengths[r]}const len=rowLengths[row],xo=len===8?0:.5,x=xo+col-3.5,y=row*SQRT3/2-5*SQRT3/2,dist=Math.hypot(x,y)||1,b=1+.12*Math.sin(t*.8+dist*1.7)*pulse,tw=(1-cor*.65)*.32*Math.sin(t*.35+dist);const p=rot({x:x/4.8*b,y:y/4.8*b},tw);return{x:p.x*SCALE,y:p.y*SCALE}}
function seedPoint(t,i,d){const mode=controls.mode.value,cor=+controls.correction.value,pulse=+controls.pulse.value;if(mode==='weave')return weavePoint(t,i,d,cor,pulse);if(mode==='cellular')return cellularPoint(t,i,d,cor,pulse);return bloomPoint(t,i,d,cor,pulse)}
function toyKaleido(t){hexField(isMobile?.010:.014,0,false);const sym=+controls.symmetry.value,d=mobileDensity(+controls.density.value);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';ctx.lineCap='round';for(let i=0;i<d;i++){const p=seedPoint(t,i,d),q=seedPoint(t+.008,i+1,d),size=(1.05+2.3*Math.pow(1-i/d,1.6))*quality,alpha=.10+.34*Math.pow(1-i/d,.65);for(let k=0;k<sym;k++){const a=TAU*k/sym,rp=rot(p,a),rq=rot(q,a),mirror=k%2===1,y1=mirror?-rp.y:rp.y,y2=mirror?-rq.y:rq.y;ctx.strokeStyle=col(k+i,alpha);ctx.lineWidth=size;ctx.beginPath();ctx.moveTo(rp.x,y1);ctx.lineTo(rq.x,y2);ctx.stroke();if(!isMobile&&i%3===0){ctx.fillStyle=col(k+2,alpha*.75);ctx.beginPath();ctx.arc(rp.x,y1,size*.88,0,TAU);ctx.fill()}}}ctx.restore()}
function clearSoft(a){ctx.save();ctx.fillStyle=`rgba(5,8,9,${a})`;ctx.fillRect(0,0,W,H);ctx.restore()}
function toyTrihex(t){clearSoft(isMobile?.10:.075);ctx.save();ctx.translate(CX,CY);const phase=(t*.12)%1,sp=SCALE/(isMobile?8:10);drawLineFamily(0,sp,'rgba(111,255,210,ALPHA)',.42,phase);drawLineFamily(Math.PI/3,sp,'rgba(111,255,210,ALPHA)',.42,phase);drawLineFamily(-Math.PI/3,sp,'rgba(111,255,210,ALPHA)',.42,phase);if(!isMobile||W>390){drawLineFamily(Math.PI/6,sp/SQRT3,'rgba(122,162,255,ALPHA)',.21,-phase);drawLineFamily(Math.PI/2,sp/SQRT3,'rgba(122,162,255,ALPHA)',.21,-phase);drawLineFamily(5*Math.PI/6,sp/SQRT3,'rgba(122,162,255,ALPHA)',.21,-phase)}ctx.globalCompositeOperation='lighter';const N=Math.min(isMobile?72:130,+controls.density.value),step=isMobile?12:8;for(let a=-N;a<=N;a+=step){for(let b=-N;b<=N;b+=step){const p=mnToXY(a/18,b/18,SCALE),r=1.1+1.6*Math.sin(t+a*.07+b*.09);ctx.fillStyle='rgba(57,255,20,.64)';ctx.beginPath();ctx.arc(p.x,p.y,Math.max(.7,r*quality),0,TAU);ctx.fill()}}ctx.restore()}
function pocketPoints(){const pts=[],rowLengths=[8,7,8,7,8,7,8,7,8,7,8];for(let r=0;r<rowLengths.length;r++){const len=rowLengths[r],xo=len===8?0:.5;for(let c=0;c<len;c++)pts.push({row:r,col:c,x:xo+c-3.5,y:r*SQRT3/2-5*SQRT3/2,len})}return pts}const pocket=pocketPoints();
function toyPocket(t){hexField(isMobile?.008:.012,0,false);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';const s=SCALE/(isMobile?5.1:5.6);for(let i=0;i<pocket.length;i++){const p=pocket[i],b=1+.07*Math.sin(t*.8+i*.21),tw=.16*Math.sin(t*.27+Math.hypot(p.x,p.y)),q=rot({x:p.x*s*b,y:p.y*s*b},tw);if(!isMobile){for(let j=i+1;j<pocket.length;j++){const r=pocket[j];if(Math.hypot(p.x-r.x,p.y-r.y)<1.02){const v=rot({x:r.x*s*b,y:r.y*s*b},tw);ctx.strokeStyle='rgba(111,255,210,.18)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(v.x,v.y);ctx.stroke()}}}const boundary=p.row===0||p.row===10||p.col===0||p.col===p.len-1;ctx.fillStyle=boundary?'rgba(255,204,102,.88)':'rgba(111,255,210,.88)';ctx.beginPath();ctx.arc(q.x,q.y,(boundary?3:2.2)*quality,0,TAU);ctx.fill()}ctx.restore()}
function toyOrbits(t){hexField(isMobile?.007:.010,0,!isMobile);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';const count=mobileDensity(+controls.density.value),sym=+controls.symmetry.value,pulse=+controls.pulse.value;for(let i=0;i<count;i++){const u=i/count,base=.12+.84*u,w1=TAU*(u*3+t*(.06+.03*(i%5))),w2=TAU*(u*5-t*.04),m=base*Math.cos(w1)+.18*Math.cos(w2)*pulse,n=base*Math.sin(w1)+.18*Math.sin(w2+TAU/6)*pulse,p=mnToXY(m,n);for(let k=0;k<sym;k++){const q=rot(p,TAU*k/sym);ctx.fillStyle=col(i+k,.12+.5*(1-u));ctx.beginPath();ctx.arc(q.x,q.y,(1.2+2.8*(1-u))*quality,0,TAU);ctx.fill()}}ctx.restore()}
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;frameSkip=(frameSkip+1)%2;if(!paused&&(!isMobile||frameSkip===0||controls.toy.value!=='trihex')){time+=dt*(+controls.speed.value)*(isMobile?1.4:1);const toy=controls.toy.value;if(toy==='trihex')toyTrihex(time);else{fade(+controls.trails.value);if(toy==='pocket')toyPocket(time);else if(toy==='orbits')toyOrbits(time);else toyKaleido(time)}}requestAnimationFrame(frame)}
function savePNG(){const a=document.createElement('a');a.download='lawful-toy.png';a.href=canvas.toDataURL('image/png');a.click()}function switchToy(i){controls.toy.selectedIndex=i;sync();clearHard();if(isMobile)hud.classList.add('compact')}
pauseBtn.onclick=()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'};seedBtn.onclick=reseed;pngBtn.onclick=savePNG;hideBtn.onclick=()=>hud.classList.add('compact');panelBtn.onclick=()=>hud.classList.toggle('compact');quick.forEach((b,i)=>b.onclick=()=>switchToy(i));canvas.addEventListener('pointerdown',e=>{if(e.target===canvas&&isMobile)hud.classList.add('compact')},{passive:true});
addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause'}if(e.key==='r'||e.key==='R')reseed();if(e.key==='h'||e.key==='H')hud.classList.toggle('compact');if(e.key==='s'||e.key==='S')savePNG();if(['1','2','3','4'].includes(e.key))switchToy(+e.key-1)});
addEventListener('resize',resize,{passive:true});resize();sync();reseed();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
