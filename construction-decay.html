<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Construction / Decay Lab</title>
<style>
:root{--bg:#050809;--panel:rgba(7,14,16,.9);--text:#eafff8;--muted:#9bcac0;--mint:#6fffd2;--gold:#ffcc66;--safe:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#050809;color:var(--text);font:14px/1.42 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:10px 10px calc(76px + var(--safe));background:radial-gradient(circle at 20% 5%,rgba(111,255,210,.13),transparent 30%),radial-gradient(circle at 80% 100%,rgba(122,162,255,.12),transparent 30%),#050809}.wrap{max-width:520px;margin:0 auto}.panel{background:var(--panel);border:1px solid rgba(111,255,210,.18);border-radius:18px;box-shadow:0 15px 48px rgba(0,0,0,.42);padding:12px;backdrop-filter:blur(14px)}.title{margin:0 0 3px;color:var(--mint);letter-spacing:.12em;text-transform:uppercase;font-size:14px}.sub{margin:0 0 10px;color:var(--muted);font-size:12px}.stage{margin:10px auto;background:#050809;border:1px solid rgba(111,255,210,.16);border-radius:18px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 10px 38px rgba(0,0,0,.38);overflow:hidden;width:min(100%,420px);aspect-ratio:1/1}canvas{display:block;width:100%;height:100%;touch-action:none}.controls{display:grid;gap:8px}.row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.row label{font-size:12px}.row output{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--gold);min-width:48px;text-align:right}select,button{min-height:42px;border:1px solid rgba(111,255,210,.24);border-radius:12px;background:rgba(4,10,11,.84);color:var(--text);font:inherit;padding:9px 10px}input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--mint)}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.buttons button{padding:8px 4px}.quick{position:fixed;left:50%;bottom:calc(10px + var(--safe));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border-radius:999px;background:rgba(0,0,0,.36);backdrop-filter:blur(10px);border:1px solid rgba(111,255,210,.16)}.quick button{width:44px;height:44px;border-radius:999px;padding:0;font-weight:700}.status{font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:rgba(234,255,248,.68);margin:8px 2px 0}.hint{font-size:11px;color:var(--muted);margin:8px 2px 0}@media(max-width:390px){body{padding-left:8px;padding-right:8px}.buttons{grid-template-columns:repeat(2,1fr)}.stage{width:min(100%,350px)}}
</style>
</head>
<body>
<main class="wrap"><section class="panel">
<h1 class="title">Construction / Decay Lab</h1>
<p class="sub">Contained, quick mobile constructions: G12, medians, pockets, decay.</p>
<div class="stage"><canvas id="stage" width="420" height="420"></canvas></div>
<div class="controls">
<div class="row"><label for="scene">Scene</label><select id="scene"><option value="g12">G12 seed</option><option value="medians">Dual medians</option><option value="pocket">Pocket build</option><option value="image">Image cluster</option><option value="triad">Triad closure</option><option value="decay">Construct / decay</option><option value="petal">Petal assembly</option></select></div>
<div class="row"><label for="cycle">Cycle</label><select id="cycle"><option value="breathe">Breathe</option><option value="construct">Construct</option><option value="decay">Decay</option><option value="hold">Hold</option></select></div>
<div class="row"><label for="speed">Speed</label><output id="speedOut">1.40</output><input id="speed" type="range" min="0.2" max="4" step="0.05" value="1.4"></div>
<div class="row"><label for="density">Density</label><output id="densityOut">52</output><input id="density" type="range" min="12" max="96" step="1" value="52"></div>
<div class="row"><label for="memory">Fade</label><output id="memoryOut">0.18</output><input id="memory" type="range" min="0.08" max="0.42" step="0.01" value="0.18"></div>
<div class="buttons"><button id="pause">Pause</button><button id="reset">Reset</button><button id="png">PNG</button><button id="next">Next</button></div>
</div>
<p class="status" id="status">ready</p><p class="hint">This page no longer draws across the whole phone. The construction is contained inside the square stage.</p>
</section></main>
<nav class="quick"><button id="back">↩</button></nav>
<script>
(function(){
const c=document.getElementById('stage'),x=c.getContext('2d'),$=id=>document.getElementById(id),TAU=Math.PI*2,SQRT3=Math.sqrt(3);let W=420,H=420,CX=210,CY=210,S=142,t=0,last=performance.now(),paused=false;const scene=$('scene'),cycle=$('cycle'),speed=$('speed'),density=$('density'),memory=$('memory'),status=$('status');const palette=[[111,255,210],[122,162,255],[255,204,102],[255,107,138],[57,255,20],[208,120,255]];
function col(i,a){const c=palette[i%palette.length];return`rgba(${c[0]},${c[1]},${c[2]},${a})`}function ease(v){v=Math.max(0,Math.min(1,v));return v*v*(3-2*v)}function pval(){if(cycle.value==='hold')return .82;let p=(t*.28)%1;if(cycle.value==='construct')return p;if(cycle.value==='decay')return 1-p;return .5+.5*Math.sin(t*1.15)}function sync(){speedOut.value=(+speed.value).toFixed(2);densityOut.value=density.value;memoryOut.value=(+memory.value).toFixed(2)}function clear(){x.fillStyle='#050809';x.fillRect(0,0,W,H)}function fade(){x.fillStyle=`rgba(5,8,9,${+memory.value})`;x.fillRect(0,0,W,H)}function rot(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c}}function xy(m,n){return{x:CX+(m+.5*n)*S,y:CY+(SQRT3/2*n)*S}}
function lineFam(th,p,dual=false){const sp=S/5.6,L=S*1.65,lim=6;const vx=Math.cos(th),vy=Math.sin(th),nx=-Math.sin(th),ny=Math.cos(th);x.strokeStyle=dual?'rgba(122,162,255,.35)':'rgba(111,255,210,.32)';x.lineWidth=1;for(let k=-lim;k<=lim;k++){if(Math.abs(k)/lim>p)continue;let d=k*sp,px=CX+nx*d,py=CY+ny*d;x.beginPath();x.moveTo(px-vx*L*p,py-vy*L*p);x.lineTo(px+vx*L*p,py+vy*L*p);x.stroke()}}
function base(p,dual=false){[0,Math.PI/3,-Math.PI/3].forEach(a=>lineFam(a,p,false));if(dual)[Math.PI/6,Math.PI/2,5*Math.PI/6].forEach(a=>lineFam(a,p,true))}
function g12(p){base(p*.65,true);x.save();x.translate(CX,CY);x.globalCompositeOperation='lighter';const R=S*.15;for(let i=0;i<13;i++){let q=ease(Math.max(0,Math.min(1,p*2-i*.09))),a=i?((i-1)%6)*TAU/6:0,ring=i>6?2:1,xx=i?Math.cos(a)*R*ring*1.9:0,yy=i?Math.sin(a)*R*ring*1.9:0;x.strokeStyle=col(i,.55*q);x.beginPath();x.arc(xx,yy,R,0,TAU*q);x.stroke()}for(let k=0;k<12;k++){x.strokeStyle=col(k,.28*p);x.beginPath();x.moveTo(0,0);x.lineTo(Math.cos(k*TAU/12)*S*1.1*p,Math.sin(k*TAU/12)*S*1.1*p);x.stroke()}x.restore()}
function medians(p){base(p,false);[Math.PI/6,Math.PI/2,5*Math.PI/6,-Math.PI/6,-Math.PI/2,-5*Math.PI/6].forEach(a=>lineFam(a,ease(Math.max(0,(p-.25)/.75)),true))}
function pocket(p){base(p*.35,false);const pts=[],rows=[8,7,8,7,8,7,8,7,8,7,8];for(let r=0;r<rows.length;r++){let len=rows[r],xo=len===8?0:.5;for(let q=0;q<len;q++)pts.push({r,q,len,x:xo+q-3.5,y:r*SQRT3/2-5*SQRT3/2})}let max=Math.floor(pts.length*ease(p));for(let i=0;i<max;i++){let a=pts[i],pt=xy(a.x/4.1,a.y/4.1),edge=a.r===0||a.r===10||a.q===0||a.q===a.len-1;x.fillStyle=edge?'rgba(255,204,102,.9)':'rgba(111,255,210,.85)';x.beginPath();x.arc(pt.x,pt.y,edge?3.2:2.4,0,TAU);x.fill()}}
function image(p){base(p*.25,true);let d=+density.value;x.save();x.translate(CX,CY);x.globalCompositeOperation='lighter';for(let i=0;i<d;i++){let u=i/d,a=TAU*(i*.618+t*.05),r=S*.12+S*.9*u*ease(p),pt={x:Math.cos(a)*r,y:Math.sin(a*1.5+i)*r*.55};for(let k=0;k<6;k++){let q=rot(pt,k*TAU/6);x.fillStyle=col(i+k,.14+.48*(1-u)*p);x.beginPath();x.arc(q.x,q.y,2.8*(1-u)+1,0,TAU);x.fill()}}x.restore()}
function triad(p){base(p*.5,false);x.save();x.translate(CX,CY);x.globalCompositeOperation='lighter';for(let k=0;k<3;k++){let a=k*TAU/3+t*.08,R=S*.72*p,A={x:Math.cos(a)*R,y:Math.sin(a)*R},B={x:Math.cos(a+TAU/3)*R,y:Math.sin(a+TAU/3)*R};x.strokeStyle=col(k,.65);x.lineWidth=2;x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();x.fillStyle=col(k,.85);x.beginPath();x.arc(A.x,A.y,4,0,TAU);x.fill()}x.restore()}
function decayScene(p){g12(p);x.save();x.globalCompositeOperation='destination-out';x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.arc(CX,CY,S*1.45*(1-p),0,TAU);x.fill();x.restore()}
function petal(p){base(p*.25,true);x.save();x.translate(CX,CY);x.globalCompositeOperation='lighter';for(let pet=0;pet<6;pet++){x.strokeStyle=col(pet,.58);x.lineWidth=2;x.beginPath();for(let i=0;i<=70*p;i++){let u=i/70*TAU,rad=S*.48*Math.sin(3*u)*ease(p),pt=rot({x:rad*Math.cos(u),y:rad*Math.sin(u)},pet*TAU/6);if(i)x.lineTo(pt.x,pt.y);else x.moveTo(pt.x,pt.y)}x.stroke()}x.restore()}
function draw(){let p=ease(pval());fade();let s=scene.value;if(s==='g12')g12(p);else if(s==='medians')medians(p);else if(s==='pocket')pocket(p);else if(s==='image')image(p);else if(s==='triad')triad(p);else if(s==='decay')decayScene(p);else petal(p);status.textContent=scene.options[scene.selectedIndex].text+' · phase '+p.toFixed(2)+' · contained stage'}
function loop(now){let dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){t+=dt*(+speed.value);draw()}requestAnimationFrame(loop)}
[scene,cycle,speed,density,memory].forEach(e=>{e.oninput=sync;e.onchange=()=>{sync();clear()}});$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause'};$('reset').onclick=()=>{t=0;clear()};$('png').onclick=()=>{let a=document.createElement('a');a.download='construction-contained.png';a.href=c.toDataURL('image/png');a.click()};$('next').onclick=()=>{scene.selectedIndex=(scene.selectedIndex+1)%scene.options.length;clear()};$('back').onclick=()=>location.href='index.html';sync();clear();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
