<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Construction / Decay Lab</title>
<style>
:root{--bg:#050809;--panel:rgba(7,14,16,.88);--text:#eafff8;--muted:#9bcac0;--mint:#6fffd2;--blue:#7aa2ff;--gold:#ffcc66;--rose:#ff6b8a;--green:#39ff14;--safe-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none;overscroll-behavior:none}body{background:radial-gradient(circle at 18% 8%,rgba(111,255,210,.14),transparent 28%),radial-gradient(circle at 82% 92%,rgba(122,162,255,.12),transparent 32%),#050809}canvas{position:fixed;inset:0;width:100vw;height:100dvh;display:block}.hud{position:fixed;left:12px;top:12px;width:min(410px,calc(100vw - 24px));max-height:calc(100dvh - 92px);overflow:auto;background:var(--panel);border:1px solid rgba(111,255,210,.18);border-radius:16px;box-shadow:0 20px 70px rgba(0,0,0,.55);backdrop-filter:blur(16px);padding:14px;z-index:5}.title{margin:0 0 4px;color:var(--mint);letter-spacing:.12em;text-transform:uppercase;font-size:15px}.subtitle{margin:0 0 12px;color:var(--muted);font-size:12px}.controls{display:grid;gap:10px}.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.row label{font-size:12px}.row output{min-width:48px;text-align:right;color:var(--gold);font:12px/1.2 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}input[type=range]{grid-column:1/-1;width:100%;height:28px;accent-color:var(--mint)}select,button{border:1px solid rgba(111,255,210,.24);border-radius:11px;background:rgba(4,10,11,.86);color:var(--text);padding:9px 10px;font:inherit;min-height:40px}button{cursor:pointer}.buttons{display:flex;gap:8px;flex-wrap:wrap}.buttons button{flex:1 1 90px}.pill{display:inline-block;margin-right:5px;margin-bottom:5px;padding:2px 7px;border-radius:999px;border:1px solid rgba(111,255,210,.26);color:var(--mint);background:rgba(111,255,210,.06);letter-spacing:.04em}.note{margin-top:12px;padding-top:12px;border-top:1px dashed rgba(111,255,210,.22);color:var(--muted);font-size:11px}.quick{position:fixed;left:50%;bottom:calc(10px + var(--safe-bottom));transform:translateX(-50%);display:flex;gap:8px;padding:8px;border:1px solid rgba(111,255,210,.16);border-radius:999px;background:rgba(0,0,0,.32);backdrop-filter:blur(12px);z-index:6}.quick button{width:44px;height:44px;border-radius:999px;padding:0;font-weight:700}.hidden{display:none!important}@media(max-width:760px){.hud{left:8px;right:8px;top:8px;width:auto;max-height:min(56dvh,420px);padding:12px}.note{display:none}select,button{min-height:44px}.hud.compact{display:none}.quick button{width:40px;height:40px}}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<section class="hud" id="hud">
<h1 class="title">Construction / Decay Lab</h1>
<p class="subtitle">G12, dual medians, lawful images, construction and dissolution.</p>
<div class="controls">
<div class="row"><label for="scene">Scene</label><select id="scene"><option value="g12">G12 Construction</option><option value="flower">Flower Self-Construction</option><option value="pocket">Pocket Build / Decay</option><option value="medians">Dual Median Loom</option><option value="image">Lawful Image Synth</option></select></div>
<div class="row"><label for="cycle">Cycle</label><select id="cycle"><option value="construct">Construct</option><option value="decay">Decay</option><option value="breathe">Construct ↔ Decay</option><option value="archive">Archive Ghosts</option></select></div>
<div class="row"><label for="speed">Speed</label><output id="speedOut">0.55</output><input id="speed" type="range" min="0.05" max="2" step="0.01" value="0.55"></div>
<div class="row"><label for="density">Density</label><output id="densityOut">84</output><input id="density" type="range" min="18" max="180" step="1" value="84"></div>
<div class="row"><label for="memory">Memory / ghosts</label><output id="memoryOut">0.12</output><input id="memory" type="range" min="0.04" max="0.35" step="0.01" value="0.12"></div>
<div class="row"><label for="phase">Manual phase</label><output id="phaseOut">auto</output><input id="phase" type="range" min="-1" max="1" step="0.01" value="-1"></div>
<div class="buttons"><button id="pause">Pause</button><button id="reset">Reset</button><button id="png">Save PNG</button><button id="hide">Hide</button></div>
</div>
<div class="note"><span class="pill">0° ±60°</span><span class="pill">G12</span><span class="pill">dual medians</span><span class="pill">construction/decay</span><br>This lab treats images as lawful assemblies: primal lines, dual medians, circles, chords, points, and echoes can appear, stabilize, and decay.</div>
</section>
<nav class="quick"><button id="menu">☰</button><button id="back">↩</button></nav>
<script>
(function(){
const canvas=document.getElementById('stage'),ctx=canvas.getContext('2d',{alpha:false});const $=id=>document.getElementById(id);const TAU=Math.PI*2,SQRT3=Math.sqrt(3);let W=0,H=0,CX=0,CY=0,S=1,DPR=1,t=0,last=performance.now(),paused=false,isMobile=false,frame=0;
const scene=$('scene'),cycle=$('cycle'),speed=$('speed'),density=$('density'),memory=$('memory'),phase=$('phase'),hud=$('hud');const out={speed:$('speedOut'),density:$('densityOut'),memory:$('memoryOut'),phase:$('phaseOut')};
const palette=[[111,255,210],[122,162,255],[255,204,102],[255,107,138],[57,255,20],[208,120,255]];
function mobile(){return matchMedia('(pointer:coarse)').matches||innerWidth<760}function resize(){isMobile=mobile();DPR=Math.min(isMobile?1.35:2,Math.max(1,devicePixelRatio||1));W=innerWidth;H=innerHeight;CX=W/2;CY=H/2;S=Math.min(W,H)*(isMobile?.46:.42);canvas.width=Math.floor(W*DPR);canvas.height=Math.floor(H*DPR);canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0);clear()}function clear(){ctx.fillStyle='#050809';ctx.fillRect(0,0,W,H)}function fade(){ctx.fillStyle=`rgba(5,8,9,${+memory.value})`;ctx.fillRect(0,0,W,H)}function col(i,a){const c=palette[i%palette.length];return`rgba(${c[0]},${c[1]},${c[2]},${a})`}function ease(x){x=Math.max(0,Math.min(1,x));return x*x*(3-2*x)}function getP(){if(+phase.value>=0)return +phase.value;let p=(t*.08)%1;if(cycle.value==='construct')return p;if(cycle.value==='decay')return 1-p;if(cycle.value==='archive')return .65+.25*Math.sin(t*.3);return .5+.5*Math.sin(t*.7)}function xy(m,n,scale=S){return{x:(m+.5*n)*scale,y:(SQRT3/2*n)*scale}}function rot(p,a){const c=Math.cos(a),s=Math.sin(a);return{x:p.x*c-p.y*s,y:p.x*s+p.y*c}}function sync(){out.speed.value=(+speed.value).toFixed(2);out.density.value=density.value;out.memory.value=(+memory.value).toFixed(2);out.phase.value=+phase.value<0?'auto':(+phase.value).toFixed(2)}[scene,cycle,speed,density,memory,phase].forEach(e=>{e.oninput=sync;e.onchange=()=>{sync();clear()}});
function lineFamily(theta,spacing,alpha,limitMul=1,progress=1,color='rgba(111,255,210,ALPHA)'){const vx=Math.cos(theta),vy=Math.sin(theta),nx=-Math.sin(theta),ny=Math.cos(theta),L=Math.hypot(W,H)*limitMul,limit=Math.ceil(L/spacing),step=isMobile?2:1;ctx.strokeStyle=color.replace('ALPHA',alpha);ctx.lineWidth=isMobile?.8:1;for(let k=-limit;k<=limit;k+=step){const order=Math.abs(k)/limit;if(order>progress)continue;const d=k*spacing,px=nx*d,py=ny*d;ctx.beginPath();ctx.moveTo(px-vx*L,py-vy*L);ctx.lineTo(px+vx*L,py+vy*L);ctx.stroke()}}
function baseFamilies(p,dual=false){ctx.save();ctx.translate(CX,CY);const sp=S/8.5;[0,Math.PI/3,-Math.PI/3].forEach((a,i)=>lineFamily(a,sp,.28+.3*p,1,p,'rgba(111,255,210,ALPHA)'));if(dual)[Math.PI/6,Math.PI/2,5*Math.PI/6].forEach((a,i)=>lineFamily(a,sp/SQRT3,.22*p,1,p,'rgba(122,162,255,ALPHA)'));ctx.restore()}
function drawCircle(x,y,r,alpha,color){ctx.strokeStyle=color;ctx.globalAlpha=alpha;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke();ctx.globalAlpha=1}
function sceneG12(p){baseFamilies(p,true);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';ctx.lineWidth=1.2;const R=S*.16;const rings=[0,1,2];let idx=0;for(const ring of rings){const count=ring===0?1:6;for(let k=0;k<count;k++){const th=k*TAU/6;const c=ring===0?{x:0,y:0}:{x:ring*2*R*Math.cos(th),y:ring*2*R*Math.sin(th)};const local=ease(Math.min(1,Math.max(0,p*2.2-idx*.045)));if(local>0){ctx.strokeStyle=col(idx,.55*local);ctx.lineWidth=(1+.8*local);ctx.beginPath();ctx.arc(c.x,c.y,R,0,TAU*local);ctx.stroke();ctx.fillStyle=col(idx,.7*local);ctx.beginPath();ctx.arc(c.x,c.y,3*local,0,TAU);ctx.fill()}idx++}}if(p>.55){const q=(p-.55)/.45;for(let k=0;k<12;k++){const a=k*TAU/12;ctx.strokeStyle=col(k,.38*q);ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(Math.cos(a)*S*.72*q,Math.sin(a)*S*.72*q);ctx.stroke()}}ctx.restore()}
function sceneFlower(p){baseFamilies(.35*p,true);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';const N=isMobile?80:140;for(let pet=0;pet<6;pet++){ctx.strokeStyle=col(pet,.55);ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<=N*p;i++){const u=i/N*TAU,rad=S*.38*Math.sin(3*u)*ease(p),pt=rot({x:rad*Math.cos(u),y:rad*Math.sin(u)},pet*TAU/6+t*.03);if(i===0)ctx.moveTo(pt.x,pt.y);else ctx.lineTo(pt.x,pt.y)}ctx.stroke()}if(cycle.value==='decay'||(cycle.value==='breathe'&&p<.5)){ctx.globalCompositeOperation='destination-out';ctx.fillStyle='rgba(0,0,0,.05)';ctx.beginPath();ctx.arc(0,0,S*.5*(1-p),0,TAU);ctx.fill()}ctx.restore()}
function scenePocket(p){baseFamilies(.25*p,false);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';const rowLengths=[8,7,8,7,8,7,8,7,8,7,8],pts=[];for(let r=0;r<rowLengths.length;r++){const len=rowLengths[r],xo=len===8?0:.5;for(let c=0;c<len;c++)pts.push({x:xo+c-3.5,y:r*SQRT3/2-5*SQRT3/2,row:r,col:c,len})}const s=S/5.2,max=Math.floor(pts.length*ease(p));for(let i=0;i<max;i++){const a=pts[i],q=rot({x:a.x*s,y:a.y*s},.18*Math.sin(t*.2));for(let j=i+1;j<max;j++){const b=pts[j];if(Math.hypot(a.x-b.x,a.y-b.y)<1.02){const v=rot({x:b.x*s,y:b.y*s},.18*Math.sin(t*.2));ctx.strokeStyle='rgba(111,255,210,.17)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(v.x,v.y);ctx.stroke()}}const boundary=a.row===0||a.row===10||a.col===0||a.col===a.len-1;ctx.fillStyle=boundary?'rgba(255,204,102,.9)':'rgba(111,255,210,.9)';ctx.beginPath();ctx.arc(q.x,q.y,(boundary?3:2.2),0,TAU);ctx.fill()}ctx.restore()}
function sceneMedians(p){ctx.save();ctx.translate(CX,CY);const sp=S/9;lineFamily(0,sp,.25,1,p,'rgba(111,255,210,ALPHA)');lineFamily(Math.PI/3,sp,.25,1,p,'rgba(111,255,210,ALPHA)');lineFamily(-Math.PI/3,sp,.25,1,p,'rgba(111,255,210,ALPHA)');const q=ease(Math.max(0,(p-.25)/.75));[Math.PI/6,Math.PI/2,5*Math.PI/6,-Math.PI/6,-Math.PI/2,-5*Math.PI/6].forEach((a,i)=>lineFamily(a,sp/SQRT3,.34*q,1,q,'rgba(122,162,255,ALPHA)'));ctx.restore()}
function sceneImage(p){baseFamilies(.18*p,true);ctx.save();ctx.translate(CX,CY);ctx.globalCompositeOperation='lighter';const d=Math.min(isMobile?90:160,+density.value);for(let i=0;i<d;i++){const u=i/d,ring=Math.floor(u*8),a=TAU*(i*.618+t*.015),r=S*.05+S*.62*ease(p)*((ring+1)/9);const m=Math.cos(a)*r/S,n=Math.sin(a*1.5+ring)*r/S;let pt=xy(m,n,S);for(let k=0;k<6;k++){const q=rot(pt,k*TAU/6);ctx.fillStyle=col(i+k,.16+.55*(1-u)*p);ctx.beginPath();ctx.arc(q.x,q.y,(2+5*(1-u))*p,0,TAU);ctx.fill()}}ctx.restore()}
function draw(){const p=getP();fade();const s=scene.value;if(s==='g12')sceneG12(p);else if(s==='flower')sceneFlower(p);else if(s==='pocket')scenePocket(p);else if(s==='medians')sceneMedians(p);else sceneImage(p)}
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(!paused){frame=(frame+1)%2;if(!isMobile||frame===0){t+=dt*(+speed.value)*(isMobile?1.3:1);draw()}}requestAnimationFrame(loop)}
function save(){const a=document.createElement('a');a.download='construction-decay.png';a.href=canvas.toDataURL('image/png');a.click()}
$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'Resume':'Pause'};$('reset').onclick=()=>{t=0;clear()};$('png').onclick=save;$('hide').onclick=()=>hud.classList.add('compact');$('menu').onclick=()=>hud.classList.toggle('compact');$('back').onclick=()=>location.href='index.html';canvas.addEventListener('pointerdown',()=>{if(isMobile)hud.classList.add('compact')},{passive:true});addEventListener('keydown',e=>{if(e.key===' '){paused=!paused;$('pause').textContent=paused?'Resume':'Pause'}if(e.key==='h'||e.key==='H')hud.classList.toggle('compact');if(e.key==='s'||e.key==='S')save()});addEventListener('resize',resize,{passive:true});resize();sync();clear();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
